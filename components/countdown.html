<!DOCTYPE html>
<html>

<body>

    <div id="counter_wrap">
        <div id="counter"></div>
        <div>
            <script>let target = new Date(2026, 9, 25, 0, 0, 0); let countdownTimer; const countdown = () => { const targetObj = document.getElementById("counter"); const now = new Date(); const differ = target.getTime() - now.getTime(); if (differ < 0) { targetObj.innerHTML = "ありがとうございました！"; return false; }; let remain = Math.floor(differ / 1000); let myDay = 0; let myHour = 0; let myMin = 0; let mySec = 0; myDay = Math.floor(remain / 86400); remain %= 86400; myHour = Math.floor(remain / 3600); remain %= 3600; myMin = Math.floor(remain / 60); remain %= 60; const myMsec = Math.floor(differ); targetObj.innerHTML = "残り" + "<br>" + myDay + '日' + myHour + '時間' + myMin + '分'; if (differ < 0) { clearInterval(countdownTimer); }; }; countdownTimer = setInterval(countdown, 10);</script>
        </div>
        <style>
            #counter {
                display: block;
                max-width: 100%;
                margin: 0 auto;
                width: 680px;
                padding: 20px 15px 20px;
                color: #364D33;
                background: #FFFFFF;
                text-align: center;
                font-size: 20px;
                line-height: 1.5em;
                font-weight: bold;
            }
        </style>
    </div>
</body>

</html>
